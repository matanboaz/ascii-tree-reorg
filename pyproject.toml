[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-tree-reorg"
dynamic = ["version"]
description = "Bidirectional ASCII directory tree reconstructor and generator."
readme = "README.md"
authors = [{ name = "Boaz Matan" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
desktop-build = ["pyinstaller>=6.0"]
test = ["pytest>=7.0.0"]

[project.scripts]
ascii-tree-reorg = "ascii_tree_reorg.app:main"
ascii-tree-reorg-gui = "ascii_tree_reorg.ui.tkinter_app:launch_gui"

[tool.setuptools.dynamic]
version = { attr = "ascii_tree_reorg.__version__" }

[tool.setuptools.package-data]
ascii_tree_reorg = ["resources/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]