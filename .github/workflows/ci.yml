name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip ".[test]"

      - name: Run test suite
        run: python -m pytest -q

  package-smoke:
    name: Build and installed-wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/ascii-tree-reorg-smoke
          /tmp/ascii-tree-reorg-smoke/bin/python -m pip install --upgrade pip
          /tmp/ascii-tree-reorg-smoke/bin/python -m pip install dist/*.whl

      - name: Smoke test installed package
        run: |
          /tmp/ascii-tree-reorg-smoke/bin/python - <<'PY'
          import importlib.metadata

          import ascii_tree_reorg
          from ascii_tree_reorg.core.generator import DirectoryTreeGenerator
          from ascii_tree_reorg.core.parser import AsciiTreeParser
          from ascii_tree_reorg.engine.reorganizer import DirectoryReorganizer

          assert importlib.metadata.version("ascii-tree-reorg")
          assert ascii_tree_reorg
          assert DirectoryTreeGenerator
          assert AsciiTreeParser
          assert DirectoryReorganizer
          PY
          /tmp/ascii-tree-reorg-smoke/bin/ascii-tree-reorg --help
